name: Test, build and package

on:
  push:
    branches: ["**"]
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked
      - run: python3 tests/security_regressions.py target/debug/lossless-checker
      - run: python3 scripts/audit_dependencies.py

  build:
    needs: test
    timeout-minutes: 30
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.100.0
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Test native targets
        if: matrix.target != 'x86_64-unknown-linux-musl' && matrix.target != 'x86_64-apple-darwin'
        run: cargo test --locked --target ${{ matrix.target }}

      - name: Package identifier
        shell: bash
        run: echo "PACKAGE_VERSION=${GITHUB_SHA:0:12}" >> "$GITHUB_ENV"

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          dir="lossless-checker-${PACKAGE_VERSION}-${{ matrix.target }}"
          mkdir "$dir"
          cp "target/${{ matrix.target }}/release/lossless-checker" "$dir/"
          cp README.md README.zh-CN.md LICENSE "$dir/"
          tar czf "$dir.tar.gz" "$dir"
          echo "ASSET=$dir.tar.gz" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          dir="lossless-checker-${PACKAGE_VERSION}-${{ matrix.target }}"
          mkdir "$dir"
          cp "target/${{ matrix.target }}/release/lossless-checker.exe" "$dir/"
          cp README.md README.zh-CN.md LICENSE "$dir/"
          7z a "$dir.zip" "$dir" >/dev/null
          echo "ASSET=$dir.zip" >> "$GITHUB_ENV"

      - name: Checksums
        shell: bash
        run: python -c 'import hashlib, os, pathlib; p = pathlib.Path(os.environ["ASSET"]); pathlib.Path(str(p) + ".sha256").write_text(hashlib.sha256(p.read_bytes()).hexdigest() + "  " + p.name + "\n")'

      - name: Upload package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lossless-checker-${{ matrix.target }}
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          pattern: lossless-checker-*
          merge-multiple: true
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
